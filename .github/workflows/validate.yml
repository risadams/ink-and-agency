name: Validate

on:
  push:
    branches: [ main ]
    paths:
    - 'skills/**'
    - 'scripts/**'
    - 'plugin.json'
    - '.claude-plugin/**'
    - 'AGENTS.md'
    - 'CLAUDE.md'
    - '.github/workflows/validate.yml'
  pull_request:
    branches: [ main ]
    paths:
    - 'skills/**'
    - 'scripts/**'
    - 'plugin.json'
    - '.claude-plugin/**'
    - 'AGENTS.md'
    - 'CLAUDE.md'
    - '.github/workflows/validate.yml'
  workflow_dispatch:


jobs:
  lint-skills:
    name: Lint skill frontmatter
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Run skill linting
      run: pwsh ./scripts/lint-skills.ps1

  codex-sync:
    name: Codex artifacts in sync
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Regenerate Codex artifacts and manifest
      run: pwsh ./scripts/convert-agents-to-codex.ps1

    - name: Fail if generated files drifted from source
      run: |
        if ! git diff --exit-code -- plugin.json '.claude-plugin/plugin.json' 'skills/**/agents/openai.yaml' CLAUDE.md; then
          echo ""
          echo "::error::Generated Codex artifacts are out of sync with skills/ or AGENTS.md."
          echo "::error::Affected: plugin.json, .claude-plugin/plugin.json, skills/*/agents/openai.yaml, CLAUDE.md."
          echo "::error::Run 'pwsh ./scripts/convert-agents-to-codex.ps1' locally and commit the result."
          exit 1
        fi
